apiVersion: app/v1
kind: Deployment

metadata:
 name: nginx-deployment
 labels:
  app: nginx
  
spec:
 replicas: 3
 selector:
  matchLabels:
   app: nginx

 template:
  metadata:
   Labels:
    app: nginx
  containers:
   - name: nginx
    image: nginx:latest
    ports:
     - containerPort: 80
    
 
 
 
