apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-deployment
  labels:
    app: nginx

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
 
          env:
          - name: APP_ENV
            valueFrom:
             configMapKeyRef:
              name: nginx-config
              key: APP_ENV

          - name: APP_NAME
            valueFrom:
             configMapKeyRef:
              name: nginx-config
              key: APP_NAME
