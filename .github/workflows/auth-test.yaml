name: GCP Auth Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/270274410591/locations/global/workloadIdentityPools/github-pool/providers/github-pool
          service_account: github-actions@project-141fab7f-fcc9-4787-bfa.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Authentication
        run: |
          gcloud auth list
          gcloud projects list
