name: Build and Push

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-141fab7f-fcc9-4787-bfa
  REGION: us-central1
  REPOSITORY: employee-app
  IMAGE: employee-k8s

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/270274410591/locations/global/workloadIdentityPools/github-pool/providers/github-pool
          service_account: github-actions@project-141fab7f-fcc9-4787-bfa.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Image
        run: |
          docker build -t employee-k8s ./firstgcp

      - name: Tag Image
        run: |
          docker tag employee-k8s \
          us-central1-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${{ github.sha }}

      - name: Push Image
        run: |
          docker push \
          us-central1-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${{ github.sha }}
